<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Tunnel – An Integers Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage" aria-label="Treasure Tunnel game">
    <div id="bgA" class="bg"></div>
    <div id="bgB" class="bg"></div>
    <div id="flare"></div>
    <div id="world"></div>
    <div id="nlWrap"><div id="nl"></div></div>

    <div id="mapView">
      <div id="mapPieces"></div>
      <svg id="mapPaths" viewBox="0 0 1200 800"></svg>
      <div id="mapSeals"></div>
      <div id="mapToken"></div>
    </div>

    <canvas id="fx" width="1280" height="720"></canvas>

    <div id="ui">
      <div id="hud">
        <div id="slots" aria-label="Collected items"></div>
        <div id="levelName"></div>
        <div class="hud-right">
          <div id="gems" title="Gems for first-try answers"><span class="gem-ico"></span><span id="gemCount">0</span></div>
          <button class="icon-btn" id="btnVoice" aria-label="Voice on or off"></button>
          <button class="icon-btn" id="btnSound" aria-label="Sound on or off"></button>
          <button class="icon-btn" id="btnHelp" aria-label="Hear the instruction again">?</button>
          <button class="icon-btn" id="btnPause" aria-label="Menu"></button>
        </div>
      </div>

      <div id="pathArt"><div class="pa-img"></div><svg class="pa-svg"><path class="pa-lit"/><path class="pa-glow"/><path class="pa-hit"/></svg><div class="pa-token"></div></div>
      <div id="scroll" aria-hidden="true"><div class="roll l"></div><div class="sheet"></div><div class="roll r"></div></div>
      <div id="rulesDrop" aria-label="Direction rules"></div>
      <div id="tablet" aria-live="polite"></div>
      <div id="ruleChip"></div>
      <div id="hintArrow"></div>
      <div id="miniLine"></div>
      <div id="demo"></div>

      <div id="bubble">
        <img class="av" alt="">
        <div class="bubble-body">
          <div class="who"></div>
          <div class="txt" aria-live="polite"></div>
        </div>
        <button class="replay" id="btnReplay" aria-label="Hear it again"></button>
        <button class="next" id="btnNext">Next</button>
      </div>

      <div id="tray" aria-label="Number pad">
        <div class="signs">
          <button class="k sign neg" data-k="-" aria-label="Negative">−</button>
          <button class="k sign pos" data-k="+" aria-label="Positive">+</button>
        </div>
        <div id="display" class="display" aria-live="polite"><span class="ph">?</span></div>
        <div class="digits"></div>
        <button class="k back" data-k="back" aria-label="Delete">⌫</button>
        <button class="k go" data-k="go" id="btnGo">GO!</button>
      </div>

      <div id="dirPick" aria-label="Move the explorer">
        <button class="mv left" data-dir="left" aria-label="Move left"><span class="arr">◀</span><svg class="ico" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 7 L7 20 L20 33 M8 20 H34" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t"> Left</span></button>
        <button class="mv jump" data-dir="jump" aria-label="Answer"><span class="t">JUMP!</span></button>
        <button class="mv right" data-dir="right" aria-label="Move right"><span class="t">Right </span><svg class="ico flip" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 7 L7 20 L20 33 M8 20 H34" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="arr">▶</span></button>
      </div>

      <button id="btnContinue" class="bigbtn">Continue</button>
      <div id="toast"></div>
      <div id="tapHint">Tap to continue</div>
    </div>

    <button id="btnMusic" class="music-btn" aria-label="Turn music off"></button>

    <div id="title" class="overlay cover">
      <!-- the cavern, its torch and crystal lights move together (slow camera drift) -->
      <div class="cv-scene">
        <img class="cv-bg" data-asset="cover_bg" alt="">
        <i class="cv-light torch" style="left:203px;top:128px"></i>
        <i class="cv-light torch" style="left:1072px;top:128px"></i>
        <i class="cv-light torch small" style="left:458px;top:410px"></i>
        <i class="cv-light torch small" style="left:825px;top:410px"></i>
        <i class="cv-light tunnel" style="left:636px;top:548px"></i>
        <i class="cv-light crystal" style="left:31px;top:150px"></i>
        <i class="cv-light crystal" style="left:34px;top:383px"></i>
        <i class="cv-light crystal" style="left:253px;top:490px"></i>
        <i class="cv-light crystal" style="left:1263px;top:150px"></i>
        <i class="cv-light crystal" style="left:1256px;top:513px"></i>
        <i class="cv-light crystal" style="left:896px;top:536px"></i>
      </div>
      <div class="cv-motes" aria-hidden="true"></div>
      <div class="cv-logo">
        <div class="cv-bob">
          <img data-asset="cover_logo" alt="Treasure Tunnel">
          <i class="cv-gem"></i>
          <i class="cv-shine"></i>
        </div>
      </div>
      <div class="cv-explorer"><img data-asset="cover_explorer" alt=""></div>
      <div class="cv-wizard"><div class="cv-sway"><img data-asset="cover_wizard" alt=""><i class="cv-orb"></i></div></div>
      <button id="soundHint" class="cv-sound" aria-label="Turn on music"><span aria-hidden="true">♪</span> Tap for music</button>
      <button id="btnStart" class="cv-start" aria-label="Start">
        <span class="cv-pulse"><img data-asset="cover_start" alt=""><i class="cv-shine"></i></span>
      </button>
    </div>

    <div id="pause" class="overlay modal" role="dialog" aria-label="Menu">
      <div class="panel">
        <h2>Paused</h2>
        <button class="bigbtn" data-act="resume">Back to the game</button>
        <div class="row">
          <button class="pill" data-act="sound"></button>
          <button class="pill" data-act="voice"></button>
        </div>
        <h3>Jump to a chapter</h3>
        <div class="chapters">
          <button class="pill" data-go="story">Story</button>
          <button class="pill" data-go="0">Amber Tunnel</button>
          <button class="pill" data-go="1">Shadow Chamber</button>
          <button class="pill" data-go="2">Crystal Cavern</button>
          <button class="pill" data-go="end">Treasure</button>
        </div>
      </div>
    </div>

    <div id="badgeModal" class="overlay modal" role="dialog" aria-label="Badge earned">
      <div class="panel badge-panel">
        <div class="rays"></div>
        <div class="badge-art"></div>
        <h2 class="badge-name"></h2>
        <p class="badge-sub"></p>
        <button class="bigbtn" id="btnBadge">Next chamber</button>
      </div>
    </div>

    <div id="final" class="overlay">
      <div class="panel final-panel">
        <div class="rays"></div>
        <div class="badge-art"></div>
        <h2>True Treasure Tunnel Explorer</h2>
        <div class="final-stats"></div>
        <button class="bigbtn" id="btnAgain">Play again</button>
      </div>
    </div>
  </div>
  <div id="rotate"><div class="rot-ico">📱</div><p>Turn your device sideways to play</p></div>
</div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
